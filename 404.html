<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדף לא נמצא | טופ שבמתמחים</title>
    <script>
        /* קישורים ישנים: האתר עבר מ-/BLOG/ לשורש הדומיין, וכל דפי הפרויקטים אוחדו לדף אחד */
        (function () {
            var MOVED = {
                'top-gif.html': '/#top-gif',
                'chatsapp.html': '/#chatsapp',
                'guide.html': '/#chat-formatter',
                'mit.html': '/#quick-reply',
                'emogi.html': '/#emoji',
                'link-to-new-guide.html': '/',
                'convertop.html': '/#convertop',
                'adshield.html': '/#adshield',
                'index.html': '/',
                'guide-pic.png': '/img/guide-tampermonkey.png',
                'guide-pic-2.png': '/img/shot-chat-formatter.png',
                'pic3.png': '/img/guide-dev-mode.png',
                'pic4.png': '/img/guide-load-unpacked.png',
                'pic-mit.png': '/img/shot-quick-reply.png',
                'gif.gif': '/img/shot-emoji.gif'
            };
            var path = location.pathname;
            try { path = decodeURIComponent(path); } catch (err) { /* כתובת לא תקינה */ }
            path = path.replace(/^\/BLOG(?=\/|$)/i, '') || '/';
            var name = path.replace(/^\/+/, '').toLowerCase();
            var target = MOVED[name] || (path !== location.pathname ? path : null);
            if (target) location.replace(target.indexOf('#') === -1 ? target + location.search + location.hash : target);
        })();
    </script>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/main.css">
    <script src="/site.js"></script>
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>
    <main class="hero container" style="flex:1">
        <img class="hero-logo" src="/img/logo.webp" alt="לוגו טופ שבמתמחים" width="112" height="112">
        <h1>הדף לא נמצא</h1>
        <p class="hero-lead">ייתכן שהקישור ישן או שהדף הועבר.</p>
        <div class="hero-actions">
            <a class="btn btn-primary" href="/"><i class="fa-solid fa-house"></i> לדף הבית</a>
        </div>
    </main>
</body>
</html>
