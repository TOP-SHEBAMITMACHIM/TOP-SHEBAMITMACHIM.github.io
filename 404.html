<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדף לא נמצא | טופ שבמתמחים</title>
    <script>
        /* האתר עבר מ-/BLOG/ לשורש הדומיין — קישורים ישנים מועברים לכתובת החדשה */
        (function () {
            var m = location.pathname.match(/^\/BLOG(\/.*)?$/i);
            if (m) location.replace((m[1] || '/') + location.search + location.hash);
        })();
    </script>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/main.css">
    <script src="/site.js"></script>
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>
    <main class="hero container" style="flex:1">
        <img class="hero-logo" src="/img/logo.webp" alt="לוגו טופ שבמתמחים" width="112" height="112">
        <h1>הדף לא נמצא</h1>
        <p class="hero-lead">ייתכן שהקישור ישן או שהדף הועבר.</p>
        <div class="hero-actions">
            <a class="btn btn-primary" href="/"><i class="fa-solid fa-house"></i> לדף הבית</a>
        </div>
    </main>
</body>
</html>
